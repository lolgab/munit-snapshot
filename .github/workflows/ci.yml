name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [jvm, js, native]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: coursier/cache-action@v9
      - run: ./mill 'munit-snapshot.${{ matrix.platform }}.test'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: coursier/cache-action@v9
      - run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll
      - run: ./mill __.fix --check
